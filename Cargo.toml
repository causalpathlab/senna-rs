[package]
name = "senna-rs"
version = "0.20.2"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Stochastic embedding with nearest-neighbourhood adjustment"
repository = "https://github.com/causalpathlab/senna-rs"
homepage = "https://github.com/causalpathlab/senna-rs"
readme = "README.md"
keywords = ["genomics", "single-cell", "embedding", "topic-model"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
    "temp*/**",
    "docs/text-anchored-gene-space-plan.md",
]

[lib]
name = "senna"
path = "src/lib.rs"

[[bin]]
name = "senna"
path = "src/main.rs"

[features]
default = ["view"]
# `senna view`: terminal viewer for layouts, clusters and annotations.
view = [
    "dep:base64",
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:image",
    "dep:pdf-writer",
    "dep:miniz_oxide",
    "dep:noto-sans-mono-bitmap",
]
cuda = [
    "legume-numeric/cuda",
    "graph-embedding-util/cuda",
]
metal = [
    "legume-numeric/metal",
    "graph-embedding-util/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
mimalloc = "0.1"
data-beans = { version = "0.7.2", features = ["aux", "alg"] }
legume-numeric = { version = "0.8.16", features = ["matrix", "param", "candle", "mcmc"] }
genomic-data = { version = "0.5.3", package = "legume-genomic-types" }
graph-embedding-util = { version = "0.8.7", package = "legume-graph-embedding" }
hsblock = { version = "0.1.1", package = "hsblock-rs" }
enrichment = { version = "0.3.9", package = "legume-enrichment" }

anyhow = "1.0"
base64 = { version = "0.22", optional = true }
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11.1", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
pdf-writer = { version = "0.15", optional = true }
miniz_oxide = { version = "0.8", optional = true }
noto-sans-mono-bitmap = { version = "0.3", optional = true, default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin", "unicode-latin-1-supplement"] }
clap = { version = "4.5.20", features = ["derive"] }
num_cpus = "1.16.0"
rayon = "1.10.0"
tempfile = "3.2"
rand = "0.10.1"
rand_distr = "0.6"
nalgebra = "0.34"
nalgebra-sparse = "0.11"

special = "0.13"
indicatif = { version = "^0.18", features = ["rayon"] }
log = "0.4"
dashmap = { version = "6.1.0", features = ["rayon"] }
rustc-hash = "2.1"
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `senna run` starts its fits on a pseudo-terminal so their progress bars draw.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["pty", "termios", "fs", "process"] }
